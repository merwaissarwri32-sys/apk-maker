name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev \
            libssl-dev openssl libgdbm-dev libgdbm-compat-dev \
            liblldb-dev libffi-dev libreadline-dev libgl1-mesa-dev \
            libgles2-mesa-dev xclip xsel ccache git python3-setuptools \
            unzip zip autoconf libtool pkg-config

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.36" "buildozer==1.5.0" virtualenv

      - name: Unzip project files
        run: |
          unzip -o app.zip

      - name: Patch buildozer.spec for Stable NDK
        run: |
          python3 -c "
          import re

          with open('buildozer.spec', 'r') as f:
              content = f.read()

          # Lock NDK to stable version 25b
          if 'android.ndk =' in content:
              content = re.sub(r'#?\s*android\.ndk\s*=.*', 'android.ndk = 25b', content)
          else:
              content += '\nandroid.ndk = 25b\n'

          # Auto accept license
          if 'android.accept_sdk_license' in content:
              content = re.sub(r'#?\s*android\.accept_sdk_license\s*=.*', 'android.accept_sdk_license = True', content)
          else:
              content += '\nandroid.accept_sdk_license = True\n'

          # Set API levels
          content = re.sub(r'#?\s*android\.api\s*=.*', 'android.api = 33', content)
          content = re.sub(r'#?\s*android\.minapi\s*=.*', 'android.minapi = 21', content)

          # Ensure Cython version
          def fix_reqs(m):
              reqs = [r.strip() for r in m.group(1).split(',') if r.strip() and not r.strip().startswith('cython')]
              reqs.append('cython==0.29.36')
              return 'requirements = ' + ','.join(reqs)

          content = re.sub(r'^requirements\s*=\s*(.*)$', fix_reqs, content, flags=re.MULTILINE)

          with open('buildozer.spec', 'w') as f:
              f.write(content)

          print('buildozer.spec successfully configured!')
          "

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: bin/*.apk
          if-no-files-found: error
