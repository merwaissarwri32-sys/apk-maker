name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev \
            libssl-dev openssl libgdbm-dev libgdbm-compat-dev \
            liblldb-dev libffi-dev libreadline-dev libgl1-mesa-dev \
            libgles2-mesa-dev xclip xsel ccache git python3-setuptools \
            unzip zip autoconf libtool pkg-config

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.36" "buildozer==1.5.0" virtualenv

      - name: Unzip project files
        run: |
          unzip -o app.zip

      - name: Safely Patch buildozer.spec
        run: |
          python3 -c "
          with open('buildozer.spec', 'r') as f:
              lines = f.readlines()

          new_lines = []
          license_found = False

          for line in lines:
              stripped = line.strip()
              if stripped.startswith('requirements'):
                  parts = line.split('=', 1)
                  reqs = [r.strip() for r in parts[1].split(',') if r.strip() and not r.strip().startswith('cython')]
                  reqs.append('cython==0.29.36')
                  new_lines.append(f'requirements = {\",\".join(reqs)}\n')
              elif stripped.startswith('android.accept_sdk_license') or stripped.startswith('#android.accept_sdk_license') or stripped.startswith('# android.accept_sdk_license'):
                  new_lines.append('android.accept_sdk_license = True\n')
                  license_found = True
              else:
                  new_lines.append(line)

          if not license_found:
              new_lines.append('\nandroid.accept_sdk_license = True\n')

          with open('buildozer.spec', 'w') as f:
              f.writelines(new_lines)

          print('buildozer.spec safely patched!')
          "

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: bin/*.apk
          if-no-files-found: error
