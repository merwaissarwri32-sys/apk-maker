name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev \
            libssl-dev openssl libgdbm-dev libgdbm-compat-dev \
            liblldb-dev libffi-dev libreadline-dev libgl1-mesa-dev \
            libgles2-mesa-dev xclip xsel ccache git python3-setuptools \
            unzip zip autoconf libtool pkg-config wget

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.36" "buildozer==1.5.0" virtualenv

      - name: Clean previous cache
        run: |
          rm -rf .buildozer bin

      - name: Unzip project files
        run: |
          if [ -f app.zip ]; then unzip -o app.zip; fi

      - name: Configure buildozer.spec
        run: |
          python3 -c "
          import os, re

          spec_file = 'buildozer.spec'
          if not os.path.exists(spec_file):
              os.system('buildozer init')

          with open(spec_file, 'r') as f:
              content = f.read()

          def set_config(key, val, text):
              pattern = r'^#?\s*' + re.escape(key) + r'\s*=.*$'
              if re.search(pattern, text, flags=re.MULTILINE):
                  return re.sub(pattern, f'{key} = {val}', text, flags=re.MULTILINE)
              else:
                  return text + f'\n{key} = {val}\n'

          content = set_config('android.api', '33', content)
          content = set_config('android.minapi', '21', content)
          content = set_config('android.ndk_api', '21', content)
          content = set_config('android.accept_sdk_license', 'True', content)

          # حذف cython از requirements اندروید
          def clean_reqs(m):
              reqs = [r.strip() for r in m.group(1).split(',') if r.strip() and 'cython' not in r.lower()]
              if not reqs:
                  reqs = ['python3', 'kivy']
              return 'requirements = ' + ','.join(reqs)

          content = re.sub(r'^requirements\s*=\s*(.*)$', clean_reqs, content, flags=re.MULTILINE)

          with open(spec_file, 'w') as f:
              f.write(content)

          print('buildozer.spec successfully fixed!')
          "

      - name: Build APK with Buildozer
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: bin/*.apk
          if-no-files-found: error
